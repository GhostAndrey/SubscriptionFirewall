name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Включает интеграционные тесты internal/adapter/mysql.
      SUBSCRIPTION_FIREWALL_TEST_DSN: "firewall:firewall@tcp(127.0.0.1:3306)/subscription_firewall_test?parseTime=true&loc=UTC"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: subscription_firewall_test
          MYSQL_USER: firewall
          MYSQL_PASSWORD: firewall
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      - run: go build ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.txt
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.2
          args: --timeout=5m
