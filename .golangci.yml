version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - nilerr
    - unconvert
    - unparam
    - wastedassign
    # Сервис работает с SQL и HTTP: проверки на незакрытые ресурсы и
    # потерянный контекст ловят утечки, которые в этом коде дорого стоят.
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - noctx
    - contextcheck
    - durationcheck
    - makezero
    - mirror
    - prealloc
  settings:
    errcheck:
      # Отложенная очистка ресурсов: ошибка Close/Rollback в defer
      # не обрабатываема и не влияет на результат операции.
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (io.ReadCloser).Close
    prealloc:
      simple: true
  exclusions:
    rules:
      # В тестах контекст и закрытие body не несут смысловой нагрузки:
      # t.Cleanup освобождает ресурс, а httptest-запросы живут миллисекунды.
      # Проверки остаются включёнными для production-кода.
      - path: _test\.go
        linters:
          - bodyclose
          - contextcheck
          - noctx

formatters:
  enable:
    - gofmt