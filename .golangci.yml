version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - nilerr
    - unconvert
    - unparam
    - wastedassign
  settings:
    errcheck:
      # Отложенная очистка ресурсов: ошибка Close/Rollback в defer
      # не обрабатываема и не влияет на результат операции.
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (io.ReadCloser).Close

formatters:
  enable:
    - gofmt
